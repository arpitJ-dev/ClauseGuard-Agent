name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check clauseguard tests scripts
      - name: Check import ordering
        run: python -m isort --check-only clauseguard tests scripts
      - name: Lint
        run: python -m flake8 clauseguard tests scripts
      - name: Type check
        run: python -m mypy clauseguard
      - name: Test
        run: python -m pytest --cov=clauseguard --cov-report=term-missing --cov-fail-under=80
