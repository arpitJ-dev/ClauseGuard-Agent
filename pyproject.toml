[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clauseguard-agent"
version = "1.0.0"
description = "Agentic contract risk analysis with evidence retrieval, independent verification, and explainable scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Arpit Jaiswal", email = "arpit.jais16@gmail.com" },
]
keywords = ["legal-ai", "contracts", "agentic-ai", "rag", "nlp"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0,<3",
  "pypdf>=6.0,<7",
  "python-docx>=0.8.11,<2",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "black>=24.0,<26",
  "flake8>=7.0,<8",
  "isort>=5.13,<7",
  "mypy>=1.10,<2",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "types-requests>=2.31",
]

[project.scripts]
clauseguard = "clauseguard.cli:main"

[project.urls]
Homepage = "https://github.com/arpitJ-dev/ClauseGuard-Agent"
Repository = "https://github.com/arpitJ-dev/ClauseGuard-Agent.git"
Issues = "https://github.com/arpitJ-dev/ClauseGuard-Agent/issues"

[tool.setuptools.packages.find]
include = ["clauseguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
files = ["clauseguard"]
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["clauseguard"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
